services:
  redis:
    image: redis:7
    container_name: stt-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stt-network
    restart: unless-stopped

  stt-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-app
    ports:
      - "${API_PORT:-8000}:8000"
      - "${AUDIO_PORT:-8001}:8001"
      - "${TRANSCRIBER_PORT:-8002}:8002"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - DATA_DIR=${DATA_DIR:-/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-100}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - STREAMING_WORKERS=${STREAMING_WORKERS:-1}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    volumes:
      - ./data:/data
      - whisper_models:/root/.cache/whisper
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stt-network
    restart: unless-stopped

volumes:
  redis_data:
  whisper_models:

networks:
  stt-network:
    driver: bridge
