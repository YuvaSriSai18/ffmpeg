[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:api-gateway]
command=python -m uvicorn api_gateway_main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/api-gateway.err.log
stdout_logfile=/var/log/supervisor/api-gateway.out.log
environment=REDIS_URL="redis://redis:6379",DATA_DIR="/data",LOG_LEVEL="INFO",MAX_FILE_SIZE="100"

[program:audio-processor]
command=python audio_processor_main.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/audio-processor.err.log
stdout_logfile=/var/log/supervisor/audio-processor.out.log
environment=REDIS_URL="redis://redis:6379",DATA_DIR="/data",WORKER_CONCURRENCY="2",STREAMING_WORKERS="1",LOG_LEVEL="INFO"

[program:transcriber]
command=python transcriber_main.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/transcriber.err.log
stdout_logfile=/var/log/supervisor/transcriber.out.log
environment=REDIS_URL="redis://redis:6379",DATA_DIR="/data",WHISPER_MODEL="base",WORKER_CONCURRENCY="1",STREAMING_WORKERS="1",LOG_LEVEL="INFO"
