name: Run Tests Before Merge

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  lint-and-build-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout flake8

      - name: Run Python linting checks
        run: |
          echo "Checking Python syntax..."
          python -m py_compile api-gateway/main.py
          python -m py_compile audio-processor/main.py
          python -m py_compile transcriber/main.py
          python -m py_compile shared/*.py
          echo "✓ All Python files have valid syntax"

      - name: Check for basic code issues
        run: |
          echo "Running basic code checks..."
          python -c "
          import ast
          files = [
              'api-gateway/main.py',
              'audio-processor/main.py', 
              'transcriber/main.py'
          ]
          for f in files:
              with open(f, 'r') as file:
                  try:
                      ast.parse(file.read())
                      print(f'✓ {f} - Valid Python')
                  except SyntaxError as e:
                      print(f'✗ {f} - Syntax Error: {e}')
                      exit(1)
          "

  dockerfile-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Dockerfile builds
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ffmpeg-stt-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for tests
        run: cp .env.example .env

      - name: Aggressive cleanup - Kill all Docker processes
        run: |
          echo "Cleaning up Docker environment..."
          docker system prune -af --volumes || true
          sleep 5
          echo "Docker system cleaned"

      - name: Verify Docker daemon is responsive
        run: docker ps

      - name: Build Docker images
        run: docker compose -f docker-compose-single.yml build

      - name: Start services (without port binding for CI)
        run: |
          echo "Starting services..."
          docker compose -f docker-compose-single.yml up -d
          sleep 15
          echo "Services started"

      - name: Verify Redis is running
        run: |
          echo "Checking Redis connection..."
          for i in {1..30}; do
            if docker exec stt-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "✓ Redis is healthy"
              docker exec stt-redis redis-cli INFO server
              exit 0
            fi
            echo "Attempt $i/30: Waiting for Redis..."
            sleep 2
          done
          echo "✗ Redis failed to start"
          docker compose -f docker-compose-single.yml logs
          exit 1

      - name: Run basic API test
        run: |
          echo "Testing API connectivity..."
          for i in {1..10}; do
            if curl -s http://localhost:8000/health 2>/dev/null || echo "API not ready yet ($i/10)"; then
              sleep 1
            fi
          done || echo "API health check skipped (expected in CI)"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose -f docker-compose-single.yml logs || true
          echo "=== Service Status ==="
          docker compose -f docker-compose-single.yml ps || true
          echo "=== Docker System Info ==="
          docker system df || true

      - name: Clean up containers
        if: always()
        run: |
          echo "Stopping services..."
          docker compose -f docker-compose-single.yml down -v 2>/dev/null || true
          sleep 3
          docker system prune -af --volumes || true
          echo "Cleanup complete"

